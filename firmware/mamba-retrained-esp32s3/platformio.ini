; Mamba HAR inference on ESP32-S3 voi trong so HUAN LUYEN LAI (DATN, doi chung MT5).
; Cung cau hinh build voi firmware/mambahar-esp32s3 (trong so cong khai); khac duy nhat:
; -I ml/results/mamba_retrained dat DAU TIEN de mamba_weights.h huan luyen lai thang
; ban cong khai trong MambaLite-Micro, va bo mau nhung mang logit tham chieu moi.
; Upstream checkout stays pristine; vendored kernel/wrapper live in firmware/common/.
[env:esp32s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-espidf @ 3.50301.0
; Board thực tế: ESP32-S3-WROOM-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
; PSRAM chưa dùng (model nằm gọn trong RAM nội) -> để tắt trong sdkconfig.esp32s3.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = espidf
monitor_speed = 115200
extra_scripts = pre:scripts/gen_build_info.py
build_flags =
    -I../../ml/results/mamba_retrained
    -I../../MambaLite-Micro/csrc
    -I../../MambaLite-Micro/examples/mambahar-arduino-6/include
