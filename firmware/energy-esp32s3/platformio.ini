; Firmware do nang luong (Brief 07): Mamba huan luyen lai + MLP trong MOT firmware, GPIO marker.
; Cung cau hinh build voi firmware/mamba-retrained-esp32s3 (sdkconfig byte-identical, -Og, 160 MHz):
; phep do nang luong phai cung cau hinh voi phep do thoi gian da co.
; -I ml/results/mamba_retrained dat DAU TIEN de mamba_weights.h huan luyen lai thang ban cong khai
; trong MambaLite-Micro. Upstream checkout stays pristine; vendored kernel/wrapper in firmware/common/.
[env:esp32s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-espidf @ 3.50301.0
; Board thuc te: ESP32-S3-WROOM-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
; PSRAM chua dung (model nam gon trong RAM noi) -> de tat trong sdkconfig.esp32s3.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = espidf
monitor_speed = 115200
extra_scripts = pre:scripts/gen_build_info.py
build_flags =
    -I../../ml/results/mamba_retrained
    -I../../MambaLite-Micro/csrc
    -I../../MambaLite-Micro/examples/mambahar-arduino-6/include
