; MambaLite-Micro HAR inference on ESP32-S3 (dev project, DATN)
; Lineage: adapted from MambaLite-Micro/examples/mambahar-arduino-6 (Arduino) and
; examples/mambakws-esp32-3 (ESP-IDF env pinning).
; Upstream checkout stays pristine; weights + sample input are referenced in place.
; Vendored under firmware/common/: mambahar.c (wrapper) + mamba.c (kernel).
[env:esp32s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-espidf @ 3.50301.0
; Board thực tế: ESP32-S3-WROOM-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
; PSRAM chưa dùng (model nằm gọn trong RAM nội) -> để tắt trong sdkconfig.esp32s3.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = espidf
monitor_speed = 115200
build_flags =
    -I../../MambaLite-Micro/csrc
    -I../../MambaLite-Micro/examples/mambahar-arduino-6/include
