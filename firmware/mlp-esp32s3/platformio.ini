; MLP 561-64-6 HAR control inference on ESP32-S3 (dev project, DATN)
; Same board, framework and sdkconfig as firmware/mambahar-esp32s3 so MT5
; timing/memory comparisons use the same build configuration.
; Weights live in firmware/common/mlp_weights.h (generated); no upstream
; MambaLite-Micro sources are compiled into this project.
[env:esp32s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-espidf @ 3.50301.0
; Board thực tế: ESP32-S3-WROOM-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
; PSRAM chưa dùng (model nằm gọn trong RAM nội) -> để tắt trong sdkconfig.esp32s3.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = espidf
monitor_speed = 115200
extra_scripts = pre:scripts/gen_build_info.py
