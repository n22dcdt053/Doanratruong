; Firmware logger do nang luong (Brief 08): doc INA226 qua I2C + bat canh marker tu devkit tren XIAO ESP32S3.
; Day la bo LOGGER rieng, KHONG phai bo duoc do. Khong dung chung sdkconfig voi devkit (khac bo, khac muc dich):
; sdkconfig.defaults cua project nay dat console = USB Serial/JTAG, tat log, -O2, tick 1 kHz.
[env:seeed_xiao_esp32s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-espidf @ 3.50301.0
board = seeed_xiao_esp32s3
; XIAO ESP32S3: 8 MB flash. PSRAM khong dung.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
framework = espidf
monitor_speed = 115200
extra_scripts = pre:scripts/gen_build_info.py
; Module INA226 dang dung tren ban do tra loi o dia chi 0x44 (A1 noi VCC, A0 noi GND; quet I2C 23/11/2026),
; khong phai 0x40 nhu brief (A0 = A1 = GND). Doi ve 0x40 neu A0/A1 duoc noi GND.
build_flags =
    -DLOGGER_INA226_ADDR=0x44
