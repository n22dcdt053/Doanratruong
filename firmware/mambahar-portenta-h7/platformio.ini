; Mamba HAR inference on Arduino Portenta H7 (STM32H7) — dev project, DATN.
; Lineage: mirrors MambaLite-Micro/examples/mambahar-arduino-6, which stays unmodified.
; Required config per thesis outline: board = portenta_h7_m7, framework = arduino.
; -I order matters: firmware/common/mambahar.c (vendor, modified) wins over upstream.
[env:portenta_h7_m7]
platform = ststm32
board = portenta_h7_m7
framework = arduino
build_flags =
    -I../../common
    -I../../MambaLite-Micro/examples/mambahar-arduino-6/include
